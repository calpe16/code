[project]
name = "financial-research-validation"
version = "1.0.0"
description = "Selected metrics and synthetic validation examples from a private research project"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas>=2.2,<3", "numpy>=2.2,<2.4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
