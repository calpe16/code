<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="285" viewBox="0 0 1280 285" role="img" aria-label="Two devices editing one record"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#567b68"/></marker></defs><rect width="1280" height="285" rx="16" fill="#edf3f0"/><text x="30" y="56" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#173d35">Two devices editing one record</text><rect x="28" y="112" width="220" height="122" rx="12" fill="#ffffff" stroke="#b5cfc2"/><text x="44" y="153" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173d35">A and B edit</text><text x="44" y="194" font-family="Arial,sans-serif" font-size="15" fill="#526c5f">Both start at version 1</text><path d="M 249 173 h 18" stroke="#567b68" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="112" width="220" height="122" rx="12" fill="#ffffff" stroke="#b5cfc2"/><text x="286" y="153" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173d35">A confirmed</text><text x="286" y="194" font-family="Arial,sans-serif" font-size="15" fill="#526c5f">Server advances to v2</text><path d="M 491 173 h 18" stroke="#567b68" stroke-width="2" marker-end="url(#a)"/><rect x="512" y="112" width="220" height="122" rx="12" fill="#ffffff" stroke="#b5cfc2"/><text x="528" y="153" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173d35">B conflicts</text><text x="528" y="194" font-family="Arial,sans-serif" font-size="15" fill="#526c5f">Local edit is retained</text><path d="M 733 173 h 18" stroke="#567b68" stroke-width="2" marker-end="url(#a)"/><rect x="754" y="112" width="220" height="122" rx="12" fill="#ffffff" stroke="#b5cfc2"/><text x="770" y="153" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173d35">B rebases</text><text x="770" y="194" font-family="Arial,sans-serif" font-size="15" fill="#526c5f">New operation on v2</text>